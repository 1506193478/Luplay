name: iOS Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 快速反馈：模拟器 Debug 编译（签名关闭）
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme Luplay

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Luplay \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1

  # 出包：Release Archive → 未签名 IPA（TrollStore / Sideloadly / AltStore 侧载重签）
  ipa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme Luplay

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme Luplay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Luplay.xcarchive \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit 1

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Luplay.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry Luplay-${{ github.run_number }}-unsigned.ipa Payload
          unzip -l Luplay-${{ github.run_number }}-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luplay-ipa-${{ github.run_number }}
          path: build/*.ipa
          retention-days: 30
